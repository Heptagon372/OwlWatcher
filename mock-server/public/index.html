<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OwlWatch 좌석 맵 (개발용)</title>
<style>
  :root{
    --paper:#FAFAF7; --paper-2:#F1F2EE; --ink:#1B1E23; --ink-2:#3E454E; --muted:#69717C;
    --line:#D7DBE0; --accent:#1F4E7A; --accent-soft:#E3ECF5;
    --ok:#2B7A4B; --ok-soft:#E2F1E7; --warn:#A46A0C; --warn-soft:#F8EDD7;
    --crit:#B3261E; --crit-soft:#F9E1DF; --signal:#B5451B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14171C; --paper-2:#1B1F26; --ink:#E6E8EA; --ink-2:#C2C7CE; --muted:#8E97A3;
      --line:#2C323B; --accent:#86B4E0; --accent-soft:#1D2B3B;
      --ok:#6CC08B; --ok-soft:#1B2F23; --warn:#E0B053; --warn-soft:#332913;
      --crit:#F08A83; --crit-soft:#3A1E1C; --signal:#E58A5F;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.6 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .warn-banner{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft);
    border-radius:4px;padding:10px 14px;font-size:13.5px;margin:0 0 22px;color:var(--ink-2)}
  .seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
  .seat{border:1px solid var(--line);border-radius:5px;padding:12px 14px;background:var(--paper-2)}
  .seat.crit{border-color:var(--crit);background:var(--crit-soft)}
  .seat.warn{border-color:var(--warn);background:var(--warn-soft)}
  .seat.armed{border-color:var(--ok);background:var(--ok-soft)}
  .seat.offline{opacity:.55}
  .seat .no{font:600 20px/1.2 "IBM Plex Mono",Consolas,monospace}
  .seat .st{font-size:13px;font-weight:600;margin-top:2px}
  .seat .meta{font:11.5px/1.5 "IBM Plex Mono",Consolas,monospace;color:var(--muted);margin-top:6px}
  .seat button{margin-top:9px;font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer;
    border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:3px}
  .seat button:hover{background:var(--accent-soft)}
  h2{font-size:15px;margin:26px 0 10px;color:var(--ink-2)}
  .feed{border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .ev{padding:9px 13px;border-bottom:1px solid var(--line);font-size:13.5px}
  .ev:last-child{border-bottom:0}
  .ev .badge{display:inline-block;font:600 11px/1.6 "IBM Plex Mono",Consolas,monospace;
    padding:1px 7px;border-radius:3px;margin-right:8px;vertical-align:1px}
  .ev.crit .badge{background:var(--crit-soft);color:var(--crit)}
  .ev.warn .badge{background:var(--warn-soft);color:var(--warn)}
  .ev.info .badge{background:var(--paper-2);color:var(--muted);border:1px solid var(--line)}
  .ev .rule{font:11.5px/1.5 "IBM Plex Mono",Consolas,monospace;color:var(--muted);margin-top:3px}
  .empty{padding:18px 14px;color:var(--muted);font-size:13.5px}
  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OwlWatch 좌석 맵</h1>
  <p class="sub">개발용 목 서버 · 2초마다 갱신</p>

  <div class="warn-banner">
    이건 콘솔이 아니라 개발용 화면이다. 인증도 권한 분리도 RLS 도 없다 — 콘솔 MVP 는 M2.
    여기 보이는 등급은 에이전트가 판정해 서명한 것을 그대로 옮긴 것이고, 서버가 다시 매기지 않는다.
  </div>

  <div class="seats" id="seats"></div>

  <h2>알림 피드 — 등급을 먼저 말한다</h2>
  <div class="feed" id="feed"><div class="empty">아직 이벤트가 없다.</div></div>

  <footer>
    OwlWatch 는 부정행위를 판정하지 않는다. P0만이 확인된 사실이고, P1은 정황, P2는 참고다.
    처분은 사람과 위원회가 한다.
  </footer>
</div>

<script>
const STATE_KO = {
  idle:'대기', precheck:'사전 점검', ready:'시작 대기', armed:'감시 중',
  warn:'정황', crit:'확인 필요', offline:'연결 끊김', ended:'종료',
};
const GUARD_KO = { ok:'캡처차단 유효', failed:'캡처차단 깨짐', unsupported:'확인 불가', off:'꺼짐' };

function seatClass(s){
  if (s.state === 'offline') return 'offline';
  if (s.state === 'crit' || s.counts.crit > 0) return 'crit';
  if (s.state === 'warn' || s.counts.warn > 0) return 'warn';
  if (s.state === 'armed') return 'armed';
  return '';
}

async function arm(id){
  await fetch(`/functions/v1/session/${encodeURIComponent(id)}/arm`, { method:'POST' });
  tick();
}

async function tick(){
  let data;
  try { data = await (await fetch('/api/state')).json(); }
  catch { return; }

  const seats = document.getElementById('seats');
  if (!data.sessions.length){
    seats.innerHTML = '<div class="empty">접속한 좌석이 없다. 에이전트를 실행하라.</div>';
  } else {
    seats.innerHTML = data.sessions.map(s => `
      <div class="seat ${seatClass(s)}">
        <div class="no">${s.seat ?? '—'}</div>
        <div class="st">${STATE_KO[s.state] ?? s.state}</div>
        <div class="meta">
          ${s.os} · ${s.level} · ${s.attestation === 'hw' ? 'TPM' : '소프트키'} · ${s.ledger === 'kernel' ? '커널원장' : '폴링원장'}<br>
          ${GUARD_KO[s.posture?.captureGuard] ?? '—'} ·
          비콘 ${s.posture?.beacon ? 'O' : 'X'} ·
          카나리 ${s.posture?.canary ? '도달!' : '차단'}<br>
          seq ${s.seq} · 확정 ${s.counts.crit} 정황 ${s.counts.warn}
          ${s.rejects.length ? '<br>거부: ' + s.rejects[s.rejects.length-1] : ''}
        </div>
        ${s.state === 'ready' ? `<button onclick="arm('${s.sessionId}')">시험 시작</button>` : ''}
      </div>`).join('');
  }

  const all = data.sessions.flatMap(s => s.events.map(e => ({...e, seat: s.seat})));
  all.sort((a,b) => (b.ts ?? '').localeCompare(a.ts ?? ''));
  const feed = document.getElementById('feed');
  feed.innerHTML = all.length
    ? all.slice(0, 60).map(e => `
        <div class="ev ${e.severity}">
          <span class="badge">${e.grade}</span>${escapeHtml(e.summary ?? '')}
          <div class="rule">${e.rule} · 신호 ${(e.signals ?? []).join('+')}${
            (e.contexts ?? []).length ? ' · 맥락 ' + e.contexts.join(', ') : ''}</div>
        </div>`).join('')
    : '<div class="empty">아직 이벤트가 없다.</div>';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
